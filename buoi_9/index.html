<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buổi 9</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800 antialiased">
    <main class="mx-auto max-w-5xl px-4 py-10 sm:py-14">
      <header class="mb-10">
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Buổi 9</h1>
      </header>

      <div class="grid gap-6 md:grid-cols-2">
        <!--Bài 1-->
        <section
          class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200"
        >
          <h2 class="text-lg font-semibold">Tính lương</h2>
          <div class="mt-4 grid gap-3 sm:grid-cols-2">
            <input
              id="luongNgay"
              type="number"
              placeholder="Nhập lương ngày"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
            <input
              id="soNgaylam"
              type="number"
              placeholder="Nhập số ngày làm"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
          </div>
          <button
            id="btnLuong"
            class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
          >
            Tính lương
          </button>
          <p
            id="ketQuaLuong"
            class="mt-4 min-h-[1.5rem] font-semibold text-indigo-700"
          ></p>
        </section>

        <!--Bài 2-->
        <section
          class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200"
        >
          <h2 class="text-lg font-semibold">Tính trung bình</h2>
          <div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3">
            <input
              id="so1"
              type="number"
              placeholder="Số 1"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
            <input
              id="so2"
              type="number"
              placeholder="Số 2"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
            <input
              id="so3"
              type="number"
              placeholder="Số 3"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
            <input
              id="so4"
              type="number"
              placeholder="Số 4"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
            <input
              id="so5"
              type="number"
              placeholder="Số 5"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
          </div>
          <button
            id="btnTrungBinh"
            class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
          >
            Tính trung bình
          </button>
          <p
            id="ketQuaTrungBinh"
            class="mt-4 min-h-[1.5rem] font-semibold text-indigo-700"
          ></p>
        </section>

        <!--Bài 3-->
        <section
          class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200"
        >
          <h2 class="text-lg font-semibold">Đổi tiền USD sang VND</h2>
          <div class="mt-4">
            <input
              id="USD"
              type="number"
              placeholder="Nhập số tiền (USD)"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
          </div>
          <button
            id="btnDoiTien"
            class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
          >
            Quy đổi tiền
          </button>
          <p
            id="ketQuaDoiTien"
            class="mt-4 min-h-[1.5rem] font-semibold text-indigo-700"
          ></p>
        </section>

        <!--Bài 4-->
        <section
          class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200"
        >
          <h2 class="text-lg font-semibold">
            Chu vi và diện tích hình chữ nhật
          </h2>
          <div class="mt-4 grid gap-3 sm:grid-cols-2">
            <input
              id="chieuDai"
              type="number"
              placeholder="Nhập chiều dài"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
            <input
              id="chieuRong"
              type="number"
              placeholder="Nhập chiều rộng"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
          </div>
          <div class="mt-4 flex flex-wrap gap-3">
            <button
              id="btnChuVi"
              class="rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
            >
              Tính chu vi
            </button>
            <button
              id="btnDienTich"
              class="rounded-lg border border-indigo-600 px-4 py-2 font-medium text-indigo-700 transition hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-300"
            >
              Tính diện tích
            </button>
          </div>
          <p
            id="ketQuaHinhChuNhat"
            class="mt-4 min-h-[1.5rem] font-semibold text-indigo-700"
          ></p>
        </section>

        <!--Bài 5-->
        <section
          class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 md:col-span-2"
        >
          <h2 class="text-lg font-semibold">Tổng ký số của số có hai chữ số</h2>
          <div class="mt-4 max-w-sm">
            <input
              id="soHaiChuSo"
              type="number"
              placeholder="Nhập số có hai chữ số"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"
            />
          </div>
          <button
            id="btnTongSoKy"
            class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
          >
            Tính tổng ký số
          </button>
          <p
            id="ketQuaKySo"
            class="mt-4 min-h-[1.5rem] font-semibold text-indigo-700"
          ></p>
        </section>
      </div>
    </main>
    <script src="./dom.js"></script>
  </body>
</html>
